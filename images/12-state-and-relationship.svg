<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="700" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#172033">Оперативное состояние и долговременное отношение</text><g font-family="Arial"><rect x="80" y="145" width="500" height="190" rx="24" fill="#f3efff" stroke="#7357c8" stroke-width="3"/><text x="330" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#513b9a">Оперативное состояние</text><text x="330" y="235" text-anchor="middle" font-size="16" fill="#606b7c">быстро меняется внутри диалога</text><text x="330" y="268" text-anchor="middle" font-size="16" fill="#606b7c">раздражение · радость · напряжение</text><text x="330" y="301" text-anchor="middle" font-size="16" fill="#606b7c">затухает и восстанавливается</text><rect x="820" y="145" width="500" height="190" rx="24" fill="#eaf8f6" stroke="#087b79" stroke-width="3"/><text x="1070" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#075f5e">Долговременное отношение</text><text x="1070" y="235" text-anchor="middle" font-size="16" fill="#606b7c">обновляется только значимыми событиями</text><text x="1070" y="268" text-anchor="middle" font-size="16" fill="#606b7c">доверие · осторожность · история</text><text x="1070" y="301" text-anchor="middle" font-size="16" fill="#606b7c">имеет отдельную политику забывания</text><path d="M580 240H820" stroke="#53647d" stroke-width="4"/><text x="700" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#52627a">только значимые события</text><rect x="245" y="420" width="910" height="90" rx="20" fill="#fff5ec"/><text x="700" y="456" text-anchor="middle" font-size="19" font-weight="700" fill="#8a481d">Слои нельзя смешивать неявно</text><text x="700" y="486" text-anchor="middle" font-size="16" fill="#606b7c">Краткая реакция не должна автоматически становиться постоянным отношением.</text></g></svg>