<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Изоляция эмоционального состояния</title><desc id="d">Каждая пара агент и диалог имеет отдельную запись состояния.</desc><rect width="1200" height="650" rx="28" fill="#081426"/><text x="60" y="70" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="34" font-weight="700">Состояние принадлежит паре «агент × диалог»</text><text x="60" y="108" fill="#9fb2ce" font-family="Arial" font-size="20">Общий character_baseline не означает общую память</text><g font-family="Arial"><rect x="70" y="180" width="285" height="100" rx="18" fill="#142a47" stroke="#62a8ff" stroke-width="2"/><text x="105" y="222" fill="#f4f7fb" font-size="23" font-weight="700">Агент A · диалог 1</text><text x="105" y="252" fill="#9fb2ce" font-size="18">storage_key = A / 1</text><rect x="70" y="330" width="285" height="100" rx="18" fill="#142a47" stroke="#62a8ff" stroke-width="2"/><text x="105" y="372" fill="#f4f7fb" font-size="23" font-weight="700">Агент A · диалог 2</text><text x="105" y="402" fill="#9fb2ce" font-size="18">storage_key = A / 2</text><rect x="70" y="480" width="285" height="100" rx="18" fill="#142a47" stroke="#a78bfa" stroke-width="2"/><text x="105" y="522" fill="#f4f7fb" font-size="23" font-weight="700">Агент B · диалог 1</text><text x="105" y="552" fill="#9fb2ce" font-size="18">storage_key = B / 1</text><path d="M355 230 H545" stroke="#62a8ff" stroke-width="4"/><path d="M355 380 H545" stroke="#62a8ff" stroke-width="4"/><path d="M355 530 H545" stroke="#a78bfa" stroke-width="4"/><rect x="545" y="180" width="580" height="100" rx="18" fill="#102238" stroke="#57d3a0" stroke-width="2"/><text x="590" y="222" fill="#f4f7fb" font-size="22" font-weight="700">previous_state[A, 1] → current_state[A, 1]</text><text x="590" y="252" fill="#9fb2ce" font-size="18">чтение и запись только в собственной сессии</text><rect x="545" y="330" width="580" height="100" rx="18" fill="#102238" stroke="#57d3a0" stroke-width="2"/><text x="590" y="372" fill="#f4f7fb" font-size="22" font-weight="700">previous_state[A, 2] → current_state[A, 2]</text><text x="590" y="402" fill="#9fb2ce" font-size="18">никакого переноса из A / 1</text><rect x="545" y="480" width="580" height="100" rx="18" fill="#102238" stroke="#57d3a0" stroke-width="2"/><text x="590" y="522" fill="#f4f7fb" font-size="22" font-weight="700">previous_state[B, 1] → current_state[B, 1]</text><text x="590" y="552" fill="#9fb2ce" font-size="18">никакого переноса между персонажами</text></g></svg>