<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Эмоция собеседника не копируется в агента</title>
  <desc id="desc">Один раздражённый сигнал проходит через характер, восприимчивость и прошлое состояние, поэтому спокойный, импульсивный и тревожный агенты формируют разные внутренние реакции.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071529"/>
      <stop offset="1" stop-color="#0d2038"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183852"/>
      <stop offset="1" stop-color="#17342f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#74a8d4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#62d5a3"/>
    </marker>
  </defs>

  <rect width="1600" height="960" rx="32" fill="url(#bg)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#f7fbff" font-size="38" font-weight="700">Эмоция собеседника не копируется в агента</text>
    <text x="800" y="101" text-anchor="middle" fill="#9fb4ce" font-size="21">Один внешний сигнал может вызвать разные внутренние реакции</text>

    <!-- Explicitly rejected direct copying -->
    <rect x="445" y="126" width="710" height="60" rx="18" fill="#331f2b" stroke="#ff747e" stroke-width="2"/>
    <text x="800" y="164" text-anchor="middle" fill="#ffc0c4" font-size="21" font-weight="700">РАЗДРАЖЕНИЕ СОБЕСЕДНИКА  ≠  РАЗДРАЖЕНИЕ АГЕНТА</text>

    <!-- Speaker input -->
    <rect x="55" y="230" width="390" height="585" rx="25" fill="#17233a" stroke="#b65769" stroke-width="2"/>
    <circle cx="250" cy="307" r="45" fill="#452633" stroke="#ff747e" stroke-width="3"/>
    <circle cx="235" cy="300" r="5" fill="#ffb6bb"/>
    <circle cx="265" cy="300" r="5" fill="#ffb6bb"/>
    <path d="M230 288 L242 283 M258 283 L270 288" stroke="#ffb6bb" stroke-width="4" stroke-linecap="round"/>
    <path d="M232 330 Q250 315 268 330" fill="none" stroke="#ffb6bb" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="379" text-anchor="middle" fill="#ffb8bd" font-size="19" font-weight="700">РАЗДРАЖЁННЫЙ СОБЕСЕДНИК</text>

    <rect x="87" y="414" width="326" height="118" rx="20" fill="#3d222e" stroke="#ff747e" stroke-width="2"/>
    <text x="250" y="458" text-anchor="middle" fill="#f7fbff" font-size="21" font-weight="600">«Сколько можно</text>
    <text x="250" y="490" text-anchor="middle" fill="#f7fbff" font-size="21" font-weight="600">повторять одно и то же?!»</text>

    <text x="250" y="581" text-anchor="middle" fill="#aebed1" font-size="18">Один и тот же вход:</text>
    <rect x="100" y="605" width="300" height="34" rx="17" fill="#263146"/>
    <rect x="100" y="605" width="252" height="34" rx="17" fill="#ff747e"/>
    <text x="250" y="628" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">сильное раздражение</text>
    <rect x="100" y="660" width="300" height="34" rx="17" fill="#263146"/>
    <rect x="100" y="660" width="221" height="34" rx="17" fill="#bb83f5"/>
    <text x="250" y="683" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">высокое напряжение</text>
    <rect x="94" y="735" width="312" height="48" rx="16" fill="#321f2b" stroke="#d96470"/>
    <text x="250" y="765" text-anchor="middle" fill="#ffc0c4" font-size="17" font-weight="700">ВНЕШНИЙ ЭМОЦИОНАЛЬНЫЙ СИГНАЛ</text>

    <!-- Arrow to transformation -->
    <line x1="445" y1="520" x2="508" y2="520" stroke="#74a8d4" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- Transformation gate -->
    <rect x="530" y="230" width="440" height="585" rx="25" fill="url(#gate)" stroke="#5c91a4" stroke-width="2"/>
    <circle cx="750" cy="315" r="58" fill="#10263b" stroke="#66c9d4" stroke-width="3"/>
    <path d="M723 316 H777 M750 289 V343" stroke="#66c9d4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="750" cy="315" r="17" fill="#66c9d4" opacity="0.25"/>
    <text x="750" y="400" text-anchor="middle" fill="#d8f4f0" font-size="24" font-weight="700">ПРЕОБРАЗОВАНИЕ</text>
    <text x="750" y="432" text-anchor="middle" fill="#9fcfc7" font-size="18">в собственную реакцию агента</text>

    <g font-size="19" font-weight="600">
      <rect x="570" y="474" width="170" height="58" rx="17" fill="#17374a" stroke="#62b1ff"/>
      <text x="655" y="510" text-anchor="middle" fill="#d9edff">характер</text>
      <rect x="760" y="474" width="170" height="58" rx="17" fill="#17374a" stroke="#62b1ff"/>
      <text x="845" y="510" text-anchor="middle" fill="#d9edff">восприимчивость</text>
      <rect x="570" y="552" width="170" height="58" rx="17" fill="#233247" stroke="#9a84e8"/>
      <text x="655" y="577" text-anchor="middle" fill="#e4dcff">прошлое</text>
      <text x="655" y="598" text-anchor="middle" fill="#e4dcff">состояние</text>
      <rect x="760" y="552" width="170" height="58" rx="17" fill="#233247" stroke="#9a84e8"/>
      <text x="845" y="577" text-anchor="middle" fill="#e4dcff">контекст</text>
      <text x="845" y="598" text-anchor="middle" fill="#e4dcff">ситуации</text>
    </g>

    <path d="M655 532 C655 645 720 628 735 676" fill="none" stroke="#62b1ff" stroke-width="3"/>
    <path d="M845 532 C845 645 780 628 765 676" fill="none" stroke="#62b1ff" stroke-width="3"/>
    <path d="M655 610 C655 675 710 668 735 690" fill="none" stroke="#9a84e8" stroke-width="3"/>
    <path d="M845 610 C845 675 790 668 765 690" fill="none" stroke="#9a84e8" stroke-width="3"/>
    <circle cx="750" cy="701" r="39" fill="#173c32" stroke="#62d5a3" stroke-width="3"/>
    <text x="750" y="710" text-anchor="middle" fill="#b9f2d7" font-size="30" font-weight="700">Σ</text>
    <text x="750" y="774" text-anchor="middle" fill="#b9f2d7" font-size="18" font-weight="700">СОБСТВЕННОЕ СОСТОЯНИЕ</text>

    <!-- Branches to agents -->
    <path d="M970 520 H1005 C1020 520 1020 302 1050 302" fill="none" stroke="#62d5a3" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M970 520 H1050" fill="none" stroke="#62d5a3" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M970 520 H1005 C1020 520 1020 738 1050 738" fill="none" stroke="#62d5a3" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <!-- Calm agent -->
    <rect x="1070" y="220" width="475" height="205" rx="22" fill="#152d34" stroke="#66c9d4" stroke-width="2"/>
    <circle cx="1120" cy="274" r="26" fill="#1d4b52" stroke="#66c9d4"/>
    <path d="M1108 278 Q1120 287 1132 278" fill="none" stroke="#b9f5f1" stroke-width="3"/>
    <circle cx="1112" cy="269" r="3" fill="#b9f5f1"/><circle cx="1128" cy="269" r="3" fill="#b9f5f1"/>
    <text x="1160" y="274" fill="#d9f8f5" font-size="24" font-weight="700">СПОКОЙНЫЙ АГЕНТ</text>
    <text x="1110" y="323" fill="#a9c5d0" font-size="17">Раздражение</text>
    <rect x="1245" y="307" width="245" height="24" rx="12" fill="#294046"/>
    <rect x="1245" y="307" width="62" height="24" rx="12" fill="#66c9d4"/>
    <text x="1110" y="363" fill="#a9c5d0" font-size="17">Устойчивость</text>
    <rect x="1245" y="347" width="245" height="24" rx="12" fill="#294046"/>
    <rect x="1245" y="347" width="211" height="24" rx="12" fill="#62d5a3"/>
    <text x="1307" y="403" text-anchor="middle" fill="#b9f2d7" font-size="16" font-weight="600">небольшое отклонение · быстрое восстановление</text>

    <!-- Impulsive agent -->
    <rect x="1070" y="438" width="475" height="205" rx="22" fill="#33232a" stroke="#ff9a66" stroke-width="2"/>
    <circle cx="1120" cy="492" r="26" fill="#543127" stroke="#ff9a66"/>
    <path d="M1107 500 Q1120 486 1133 500" fill="none" stroke="#ffd0b9" stroke-width="3"/>
    <circle cx="1112" cy="486" r="3" fill="#ffd0b9"/><circle cx="1128" cy="486" r="3" fill="#ffd0b9"/>
    <text x="1160" y="492" fill="#ffe2d2" font-size="24" font-weight="700">ИМПУЛЬСИВНЫЙ АГЕНТ</text>
    <text x="1110" y="541" fill="#cfb7ae" font-size="17">Раздражение</text>
    <rect x="1245" y="525" width="245" height="24" rx="12" fill="#46352f"/>
    <rect x="1245" y="525" width="223" height="24" rx="12" fill="#ff8c61"/>
    <text x="1110" y="581" fill="#cfb7ae" font-size="17">Длительность</text>
    <rect x="1245" y="565" width="245" height="24" rx="12" fill="#46352f"/>
    <rect x="1245" y="565" width="95" height="24" rx="12" fill="#ffb85c"/>
    <text x="1307" y="621" text-anchor="middle" fill="#ffd4b8" font-size="16" font-weight="600">сильный всплеск · сравнительно быстрое затухание</text>

    <!-- Anxious agent -->
    <rect x="1070" y="656" width="475" height="205" rx="22" fill="#27213a" stroke="#bb83f5" stroke-width="2"/>
    <circle cx="1120" cy="710" r="26" fill="#392c56" stroke="#bb83f5"/>
    <path d="M1108 718 Q1120 706 1132 718" fill="none" stroke="#ead7ff" stroke-width="3"/>
    <circle cx="1112" cy="704" r="4" fill="#ead7ff"/><circle cx="1128" cy="704" r="4" fill="#ead7ff"/>
    <text x="1160" y="710" fill="#f0e0ff" font-size="24" font-weight="700">ТРЕВОЖНЫЙ АГЕНТ</text>
    <text x="1110" y="759" fill="#c7b7da" font-size="17">Тревога</text>
    <rect x="1245" y="743" width="245" height="24" rx="12" fill="#39324b"/>
    <rect x="1245" y="743" width="196" height="24" rx="12" fill="#bb83f5"/>
    <text x="1110" y="799" fill="#c7b7da" font-size="17">Длительность</text>
    <rect x="1245" y="783" width="245" height="24" rx="12" fill="#39324b"/>
    <rect x="1245" y="783" width="220" height="24" rx="12" fill="#8f72dd"/>
    <text x="1307" y="839" text-anchor="middle" fill="#e4d5f8" font-size="16" font-weight="600">раздражение преобразуется в длительную тревогу</text>

    <!-- Bottom conclusion -->
    <rect x="134" y="892" width="1332" height="50" rx="17" fill="#102b28" stroke="#48b48a" stroke-width="2"/>
    <text x="800" y="924" text-anchor="middle" fill="#b9f2d7" font-size="20" font-weight="700">Внешняя эмоция — вход модели; состояние агента — результат индивидуального преобразования</text>
  </g>
</svg>
