<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Жизненный цикл эмоционального состояния</title><desc id="desc">Инициализация, обновление, ограничение, сохранение и восстановление состояния агента.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#52627a"/></marker></defs><rect width="1400" height="720" fill="#f7f9fc"/>
<text x="700" y="58" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#172033">Жизненный цикл current_state</text><text x="700" y="93" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#606b7c">Состояние принадлежит паре «агент — диалог», а не глобальной модели</text>
<g font-family="Segoe UI,Arial">
 <rect x="70" y="180" width="235" height="140" rx="22" fill="#f3efff" stroke="#7357c8" stroke-width="3"/><text x="188" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#513b9a">Инициализация</text><text x="188" y="256" text-anchor="middle" font-size="15" fill="#172033">initial_state</text><text x="188" y="285" text-anchor="middle" font-size="14" fill="#606b7c">характер или нейтральный вектор</text>
 <rect x="385" y="180" width="235" height="140" rx="22" fill="#edf4ff" stroke="#315e9d" stroke-width="3"/><text x="503" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#234c84">Обновление</text><text x="503" y="256" text-anchor="middle" font-size="15" fill="#172033">два слоя расчёта</text><text x="503" y="285" text-anchor="middle" font-size="14" fill="#606b7c">один выбранный шаг</text>
 <rect x="700" y="180" width="235" height="140" rx="22" fill="#fff5ec" stroke="#d97a3a" stroke-width="3"/><text x="818" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#9b511e">Ограничение</text><text x="818" y="256" text-anchor="middle" font-size="15" fill="#172033">constrain(current_state)</text><text x="818" y="285" text-anchor="middle" font-size="14" fill="#606b7c">clip / sigmoid / другая policy</text>
 <rect x="1015" y="180" width="300" height="140" rx="22" fill="#eaf8f6" stroke="#087b79" stroke-width="3"/><text x="1165" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#075f5e">Сохранение</text><text x="1165" y="252" text-anchor="middle" font-size="15" fill="#172033">agent_id · conversation_id</text><text x="1165" y="278" text-anchor="middle" font-size="15" fill="#172033">vector · step · timestamp</text><text x="1165" y="302" text-anchor="middle" font-size="14" fill="#606b7c">model_version · seed</text>
 <rect x="385" y="455" width="550" height="150" rx="24" fill="#fff" stroke="#8c99aa" stroke-width="3"/><text x="660" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">Следующее событие обновления</text><text x="660" y="530" text-anchor="middle" font-size="16" fill="#52627a">загрузить current_state → учесть elapsed_time</text><text x="660" y="565" text-anchor="middle" font-size="17" fill="#315e9d">time_decay = exp(−elapsed_time / memory_time_constant)</text>
</g>
<g fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#a)"><path d="M305 250H385"/><path d="M620 250H700"/><path d="M935 250H1015"/><path d="M1165 320V390Q1165 420 935 493"/><path d="M385 530H250Q190 530 190 360V320"/></g>
<rect x="70" y="645" width="1245" height="42" rx="18" fill="#edf4ff"/><text x="692" y="672" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#294f83">Новый диалог должен иметь явную policy: сброс, восстановление состояния сессии или загрузка долговременной памяти.</text>
</svg>
