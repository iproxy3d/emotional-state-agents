<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Устойчивость рекуррентной памяти</title><desc id="d">Сравнение быстрого затухания, медленного затухания и роста состояния.</desc><rect width="1200" height="650" rx="28" fill="#081426"/><text x="60" y="70" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="34" font-weight="700">Три режима памяти</text><text x="60" y="108" fill="#9fb2ce" font-family="Arial,sans-serif" font-size="20">След одного события при отсутствии новых входов</text><line x1="110" y1="520" x2="1120" y2="520" stroke="#60728f" stroke-width="2"/><line x1="110" y1="150" x2="110" y2="520" stroke="#60728f" stroke-width="2"/><text x="40" y="160" fill="#9fb2ce" font-family="Arial" font-size="18">1,0</text><text x="80" y="555" fill="#9fb2ce" font-family="Arial" font-size="18">t0</text><text x="1070" y="555" fill="#9fb2ce" font-family="Arial" font-size="18">шаги</text><polyline points="110,170 290,415 470,489 650,511 830,518 1010,520" fill="none" stroke="#57d3a0" stroke-width="7"/><polyline points="110,170 290,240 470,296 650,341 830,377 1010,406" fill="none" stroke="#62a8ff" stroke-width="7"/><polyline points="110,470 290,445 470,405 650,345 830,255 1010,120" fill="none" stroke="#ff6b78" stroke-width="7"/><rect x="700" y="155" width="390" height="126" rx="18" fill="#101f36" stroke="#2b4163"/><circle cx="735" cy="190" r="7" fill="#57d3a0"/><text x="755" y="197" fill="#f4f7fb" font-family="Arial" font-size="20">0,3 — быстрое затухание</text><circle cx="735" cy="225" r="7" fill="#62a8ff"/><text x="755" y="232" fill="#f4f7fb" font-family="Arial" font-size="20">0,8 — длинный след</text><circle cx="735" cy="260" r="7" fill="#ff6b78"/><text x="755" y="267" fill="#f4f7fb" font-family="Arial" font-size="20">&gt; 1 — риск роста</text><text x="110" y="610" fill="#d6e2f2" font-family="Arial" font-size="21">Условие затухания: |memory_retention| &lt; 1</text></svg>