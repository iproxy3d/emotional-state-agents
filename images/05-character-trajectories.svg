<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Три эмоциональные траектории после одного конфликта</title><desc id="desc">Спокойный, импульсивный и тревожный персонажи по-разному реагируют на конфликт и восстанавливаются после него.</desc>
<rect width="1400" height="760" fill="#f7f9fc"/>
<text x="700" y="55" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#172033">Один конфликт — разные траектории</text>
<text x="700" y="91" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#606b7c">Условная интенсивность негативного состояния после одинакового внешнего события</text>
<g font-family="Segoe UI,Arial">
 <line x1="120" y1="620" x2="1280" y2="620" stroke="#8290a3" stroke-width="3"/><line x1="120" y1="145" x2="120" y2="620" stroke="#8290a3" stroke-width="3"/>
 <g fill="#606b7c" font-size="15"><text x="72" y="625">0,0</text><text x="72" y="510">0,25</text><text x="72" y="390">0,50</text><text x="72" y="270">0,75</text><text x="72" y="152">1,0</text></g>
 <g stroke="#d9dfe8" stroke-width="1"><line x1="120" y1="500" x2="1280" y2="500"/><line x1="120" y1="380" x2="1280" y2="380"/><line x1="120" y1="260" x2="1280" y2="260"/></g>
 <g fill="#52627a" font-size="15" text-anchor="middle"><text x="170" y="655">до события</text><text x="390" y="655">конфликт</text><text x="610" y="655">спокойная реплика</text><text x="830" y="655">извинение</text><text x="1050" y="655">следующий шаг</text><text x="1240" y="655">восстановление</text></g>
 <line x1="390" y1="145" x2="390" y2="620" stroke="#d97a3a" stroke-width="2" stroke-dasharray="8 7"/><text x="405" y="176" font-size="15" font-weight="700" fill="#9b511e">внешний импульс</text>
 <polyline points="170,560 390,430 610,500 830,540 1050,555 1240,560" fill="none" stroke="#25877f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <polyline points="170,520 390,185 610,325 830,455 1050,505 1240,520" fill="none" stroke="#d66b35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <polyline points="170,480 390,255 610,285 830,335 1050,395 1240,455" fill="none" stroke="#7357c8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <g fill="#25877f"><circle cx="170" cy="560" r="7"/><circle cx="390" cy="430" r="7"/><circle cx="610" cy="500" r="7"/><circle cx="830" cy="540" r="7"/><circle cx="1050" cy="555" r="7"/><circle cx="1240" cy="560" r="7"/></g>
 <g fill="#d66b35"><circle cx="170" cy="520" r="7"/><circle cx="390" cy="185" r="7"/><circle cx="610" cy="325" r="7"/><circle cx="830" cy="455" r="7"/><circle cx="1050" cy="505" r="7"/><circle cx="1240" cy="520" r="7"/></g>
 <g fill="#7357c8"><circle cx="170" cy="480" r="7"/><circle cx="390" cy="255" r="7"/><circle cx="610" cy="285" r="7"/><circle cx="830" cy="335" r="7"/><circle cx="1050" cy="395" r="7"/><circle cx="1240" cy="455" r="7"/></g>
 <rect x="865" y="120" width="405" height="100" rx="16" fill="#fff" stroke="#d9dfe8"/><line x1="895" y1="148" x2="945" y2="148" stroke="#25877f" stroke-width="7"/><text x="962" y="154" font-size="16" fill="#172033">Спокойный: слабое отклонение</text><line x1="895" y1="178" x2="945" y2="178" stroke="#d66b35" stroke-width="7"/><text x="962" y="184" font-size="16" fill="#172033">Импульсивный: сильный, короткий всплеск</text><line x1="895" y1="208" x2="945" y2="208" stroke="#7357c8" stroke-width="7"/><text x="962" y="214" font-size="16" fill="#172033">Тревожный: медленное восстановление</text>
 <text x="36" y="405" transform="rotate(-90 36 405)" text-anchor="middle" font-size="17" font-weight="700" fill="#52627a">Интенсивность негативного состояния</text>
</g>
<rect x="120" y="695" width="1160" height="40" rx="18" fill="#edf4ff"/><text x="700" y="721" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#294f83">Линии иллюстрируют принцип модели: масштаб реакции, память и область возврата являются свойствами персонажа.</text>
</svg>
