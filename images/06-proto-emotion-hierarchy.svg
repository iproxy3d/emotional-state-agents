<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="700" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">От звука к состоянию агента</text><g font-family="Arial"><g fill="#fff" stroke-width="3"><rect x="55" y="145" width="280" height="150" rx="20" stroke="#7357c8"/><rect x="385" y="145" width="280" height="150" rx="20" stroke="#315e9d"/><rect x="735" y="145" width="280" height="150" rx="20" stroke="#d97a3a"/><rect x="1065" y="145" width="280" height="150" rx="20" stroke="#087b79"/></g><g text-anchor="middle" font-size="21" font-weight="700" fill="#172033"><text x="195" y="190">Звуковые признаки</text><text x="525" y="190">Прото-эмоции</text><text x="875" y="190">Смысловые эмоции</text><text x="1205" y="190">Состояние агента</text></g><g text-anchor="middle" font-size="16" fill="#606b7c"><text x="195" y="230">тон · скорость · сила</text><text x="195" y="260">напряжение · изменения</text><text x="525" y="230">базовая форма</text><text x="525" y="260">и интенсивность</text><text x="875" y="230">страх · гнев · радость</text><text x="875" y="260">и другие классы</text><text x="1205" y="230">характер · память</text><text x="1205" y="260">текущая ситуация</text></g><g stroke="#53647d" stroke-width="4"><path d="M335 220H385"/><path d="M665 220H735"/><path d="M1015 220H1065"/></g><rect x="430" y="380" width="540" height="95" rx="20" fill="#fff5ec"/><text x="700" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#8a481d">Текст и контекст</text><text x="700" y="452" text-anchor="middle" font-size="16" fill="#606b7c">разрешают неоднозначность акустической основы</text><path d="M700 380V295" stroke="#d97a3a" stroke-width="4"/><rect x="170" y="525" width="1060" height="48" rx="18" fill="#f3efff"/><text x="700" y="556" text-anchor="middle" font-size="17" fill="#513b9a">Один звуковой паттерн может поддерживать несколько эмоций верхнего уровня.</text></g></svg>