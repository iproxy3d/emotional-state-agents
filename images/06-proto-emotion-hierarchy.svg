<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Прото-эмоции и эмоции связаны многие ко многим</title><desc id="desc">Возбуждение, напряжение, ускорение и положительная окраска участвуют в нескольких эмоциях; смысл и контекст разрешают неоднозначность.</desc><rect width="1400" height="780" fill="#f7f9fc"/><text x="700" y="54" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">Прото-эмоции — общие кирпичики разных эмоций</text><text x="700" y="88" text-anchor="middle" font-family="Arial" font-size="17" fill="#606b7c">Связь многие ко многим: ни один акустический паттерн не задаёт готовый смысловой класс</text><g font-family="Arial"><text x="245" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#315e9d">ПРОТО-ЭМОЦИИ ИЗ АУДИО</text><text x="1140" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#d06b31">ЭМОЦИИ ВЕРХНЕГО УРОВНЯ</text><g fill="#fff" stroke="#315e9d" stroke-width="3"><rect x="70" y="175" width="350" height="80" rx="17"/><rect x="70" y="285" width="350" height="80" rx="17"/><rect x="70" y="395" width="350" height="80" rx="17"/><rect x="70" y="505" width="350" height="80" rx="17"/></g><g text-anchor="middle" font-size="20" fill="#294f83"><text x="245" y="224">Возбуждение</text><text x="245" y="334">Напряжение</text><text x="245" y="444">Ускорение</text><text x="245" y="554">Положительная окраска</text></g><g fill="#fff5ec" stroke="#d97a3a" stroke-width="3"><rect x="980" y="175" width="350" height="80" rx="17"/><rect x="980" y="285" width="350" height="80" rx="17"/><rect x="980" y="395" width="350" height="80" rx="17"/><rect x="980" y="505" width="350" height="80" rx="17"/></g><g text-anchor="middle" font-size="20" fill="#8a481d"><text x="1155" y="224">Страх</text><text x="1155" y="334">Гнев</text><text x="1155" y="444">Радость</text><text x="1155" y="554">Нервозность</text></g><g fill="none" stroke-width="4" opacity=".78"><path d="M420 215C650 215 750 215 980 215" stroke="#7357c8"/><path d="M420 215C650 220 760 320 980 325" stroke="#7357c8"/><path d="M420 215C650 240 760 420 980 435" stroke="#7357c8"/><path d="M420 215C650 250 760 530 980 545" stroke="#7357c8"/><path d="M420 325C650 300 760 230 980 215" stroke="#315e9d"/><path d="M420 325C650 325 760 325 980 325" stroke="#315e9d"/><path d="M420 325C650 360 760 510 980 545" stroke="#315e9d"/><path d="M420 435C650 390 760 250 980 215" stroke="#087b79"/><path d="M420 435C650 415 760 340 980 325" stroke="#087b79"/><path d="M420 435C650 435 760 435 980 435" stroke="#087b79"/><path d="M420 545C650 520 760 450 980 435" stroke="#d97a3a"/></g><rect x="370" y="635" width="660" height="80" rx="20" fill="#eaf8f6" stroke="#087b79" stroke-width="2"/><text x="700" y="670" text-anchor="middle" font-size="20" font-weight="700" fill="#075f5e">Смысл текста и контекст</text><text x="700" y="698" text-anchor="middle" font-size="16" fill="#606b7c">определяют, какая комбинация получает смысловую интерпретацию</text></g></svg>