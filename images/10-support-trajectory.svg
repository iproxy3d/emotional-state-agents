<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="700" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#172033">Тревога клиента меняется во время разговора</text><g font-family="Arial"><line x1="110" y1="490" x2="1300" y2="490" stroke="#8290a3" stroke-width="3"/><line x1="110" y1="130" x2="110" y2="490" stroke="#8290a3" stroke-width="3"/><polyline points="160,420 390,300 620,165 850,235 1080,350 1260,430" fill="none" stroke="#d66b35" stroke-width="8"/><g fill="#d66b35"><circle cx="160" cy="420" r="9"/><circle cx="390" cy="300" r="9"/><circle cx="620" cy="165" r="9"/><circle cx="850" cy="235" r="9"/><circle cx="1080" cy="350" r="9"/><circle cx="1260" cy="430" r="9"/></g><g text-anchor="middle" font-size="15" fill="#52627a"><text x="160" y="530">начало</text><text x="390" y="530">неудачное объяснение</text><text x="620" y="530">пик тревоги</text><text x="850" y="530">решение предложено</text><text x="1080" y="530">проверка понимания</text><text x="1260" y="530">восстановление</text></g><line x1="850" y1="120" x2="850" y2="490" stroke="#315e9d" stroke-width="2" stroke-dasharray="8 7"/><text x="875" y="145" font-size="16" font-weight="700" fill="#294f83">слова уже нейтральны</text><text x="875" y="172" font-size="15" fill="#606b7c">но эмоциональный след ещё высок</text><text x="35" y="320" transform="rotate(-90 35 320)" font-size="17" font-weight="700" fill="#52627a">напряжение</text></g></svg>