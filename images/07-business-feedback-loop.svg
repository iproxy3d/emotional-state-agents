<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="700" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">Эмоциональная обратная связь продукта</text><g font-family="Arial"><g fill="#fff" stroke="#087b79" stroke-width="3"><rect x="65" y="155" width="250" height="120" rx="20"/><rect x="390" y="155" width="250" height="120" rx="20"/><rect x="715" y="155" width="250" height="120" rx="20"/><rect x="1040" y="155" width="295" height="120" rx="20"/></g><g text-anchor="middle" font-size="20" font-weight="700" fill="#075f5e"><text x="190" y="205">Сигналы</text><text x="515" y="205">Траектория</text><text x="840" y="205">Действие</text><text x="1188" y="205">Проверка эффекта</text></g><g text-anchor="middle" font-size="15" fill="#606b7c"><text x="190" y="240">текст и прото-эмоции</text><text x="515" y="240">состояние и память</text><text x="840" y="240">следующая стратегия</text><text x="1188" y="240">снизилось ли напряжение?</text></g><g stroke="#53647d" stroke-width="4"><path d="M315 215H390"/><path d="M640 215H715"/><path d="M965 215H1040"/><path d="M1188 275V390H515V275"/></g><rect x="300" y="430" width="800" height="58" rx="18" fill="#eaf8f6"/><text x="700" y="466" text-anchor="middle" font-size="18" fill="#075f5e">Ценность создаёт изменение траектории, а не сама эмоциональная метка.</text></g></svg>