x="16" fill="#142a47" stroke="#a78bfa" stroke-width="2"/><text x="95" y="538" fill="#f4f7fb" font-size="22">previous_state</text><path d="M330 530 H1080 V305" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="390" y="485" width="300" height="90" rx="16" fill="#142a47" stroke="#a78bfa" stroke-width="2"/><text x="425" y="538" fill="#f4f7fb" font-size="22">character_baseline</text><rect x="780" y="460" width="260" height="120" rx="18" fill="#23304a" stroke="#a78bfa" stroke-width="3"/><text x="838" y="512" fill="#f4f7fb" font-size="24" font-weight="700">Финальный</text><text x="865" y="544" fill="#f4f7fb" font-size="24" font-weight="700">слой</text><path d="M1210 330 V430 H970 V460 M690 530 H780" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1080" y="460" width="260" height="120" rx="18" fill="#143326" stroke="#57d3a0" stroke-width="3"/><text x="1152" y="512" fill="#f4f7fb" font-size="24" font-weight="700">constrain</text><text x="1117" y="544" fill="#f4f7fb" font-size="21">current_state</text><path d="M1040 520 H1080" stroke="#57d3a0" stroke-width="4" marker-end="url(#a)"/><path d="M1210 580 V690 H195 V575" stroke="#57d3a0" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="500" y="730" fill="#9fb2ce" font-size="21">current_state сохраняется и становится previous_state следующего шага</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9fb2ce"/></marker></defs></svg>