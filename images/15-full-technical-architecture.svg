<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Полная инженерная архитектура эмоционального состояния</title>
  <desc id="desc">Семантический слой, относительная акустическая коррекция, второй рекуррентный слой и обратная связь через реально сгенерированный голос агента.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#9fb2ce"/></marker></defs>
  <rect width="1600" height="980" rx="28" fill="#081426"/>
  <text x="70" y="67" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">Замкнутая петля эмоционального состояния</text>
  <text x="70" y="105" fill="#9fb2ce" font-family="Arial" font-size="18">Состояние переносит контекст, а последний голос агента — акустическую точку отсчёта</text>

  <g font-family="Arial">
    <text x="70" y="160" fill="#62a8ff" font-size="20" font-weight="700">1 · СМЫСЛОВОЙ СЛОЙ</text>
    <rect x="70" y="190" width="245" height="75" rx="15" fill="#142a47" stroke="#62a8ff" stroke-width="2"/><text x="193" y="236" text-anchor="middle" fill="#f4f7fb" font-size="19">text_emotions</text>
    <rect x="70" y="285" width="245" height="75" rx="15" fill="#142a47" stroke="#62a8ff" stroke-width="2"/><text x="193" y="331" text-anchor="middle" fill="#f4f7fb" font-size="18">response_emotions</text>
    <rect x="70" y="380" width="245" height="75" rx="15" fill="#211e42" stroke="#a78bfa" stroke-width="2"/><text x="193" y="426" text-anchor="middle" fill="#f4f7fb" font-size="18">previous_state(t−1)</text>
    <rect x="400" y="260" width="300" height="125" rx="20" fill="#12334a" stroke="#57d3a0" stroke-width="3"/><text x="550" y="310" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">Первый слой</text><text x="550" y="350" text-anchor="middle" fill="#bfead8" font-size="20">semantic_state(t)</text>

    <text x="70" y="520" fill="#f5b95f" font-size="20" font-weight="700">2 · ОТНОСИТЕЛЬНАЯ АКУСТИКА</text>
    <rect x="70" y="550" width="245" height="75" rx="15" fill="#2a2336" stroke="#f5b95f" stroke-width="2"/><text x="193" y="596" text-anchor="middle" fill="#f4f7fb" font-size="18">A_other(t)</text>
    <rect x="70" y="645" width="245" height="75" rx="15" fill="#211e42" stroke="#a78bfa" stroke-width="2"/><text x="193" y="691" text-anchor="middle" fill="#f4f7fb" font-size="18">A_agent(t−1)</text>
    <rect x="390" y="585" width="210" height="105" rx="18" fill="#143326" stroke="#57d3a0" stroke-width="3"/><text x="495" y="630" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">Fθ</text><text x="495" y="662" text-anchor="middle" fill="#bfead8" font-size="16">X_other, X_agent</text>
    <rect x="675" y="585" width="270" height="105" rx="18" fill="#2a2336" stroke="#f5b95f" stroke-width="3"/><text x="810" y="626" text-anchor="middle" fill="#f4f7fb" font-size="19" font-weight="700">ΔX → normalize</text><text x="810" y="658" text-anchor="middle" fill="#f5d9a7" font-size="16">s + deviation</text>
    <rect x="1020" y="560" width="330" height="155" rx="20" fill="#143326" stroke="#57d3a0" stroke-width="3"/><text x="1185" y="605" text-anchor="middle" fill="#f4f7fb" font-size="19" font-weight="700">A_proto(t)</text><text x="1185" y="640" text-anchor="middle" fill="#bfead8" font-size="16">η × deviation ×</text><text x="1185" y="670" text-anchor="middle" fill="#bfead8" font-size="16">previous_state ⊙ Mᵀs</text>

    <text x="790" y="160" fill="#a78bfa" font-size="20" font-weight="700">3 · ИТОГОВОЕ СОСТОЯНИЕ</text>
    <rect x="790" y="220" width="290" height="90" rx="17" fill="#211e42" stroke="#a78bfa" stroke-width="2"/><text x="935" y="274" text-anchor="middle" fill="#f4f7fb" font-size="19">character_baseline</text>
    <rect x="1210" y="265" width="310" height="175" rx="22" fill="#23304a" stroke="#a78bfa" stroke-width="4"/><text x="1365" y="322" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">Второй слой</text><text x="1365" y="365" text-anchor="middle" fill="#d8cdfd" font-size="20">current_state(t)</text><text x="1365" y="400" text-anchor="middle" fill="#9fb2ce" font-size="16">после constrain</text>

    <text x="760" y="790" fill="#57d3a0" font-size="20" font-weight="700">4 · ОБРАТНАЯ СВЯЗЬ ГОЛОСА</text>
    <rect x="760" y="820" width="245" height="85" rx="18" fill="#143326" stroke="#57d3a0" stroke-width="3"/><text x="883" y="858" text-anchor="middle" fill="#f4f7fb" font-size="19" font-weight="700">TTS</text><text x="883" y="885" text-anchor="middle" fill="#bfead8" font-size="15">response + state</text>
    <rect x="1080" y="820" width="245" height="85" rx="18" fill="#2a2336" stroke="#f5b95f" stroke-width="3"/><text x="1203" y="872" text-anchor="middle" fill="#f4f7fb" font-size="19">A_agent(t)</text>
    <rect x="1390" y="800" width="160" height="125" rx="18" fill="#211e42" stroke="#a78bfa" stroke-width="3"/><text x="1470" y="850" text-anchor="middle" fill="#f4f7fb" font-size="20" font-weight="700">Fθ</text><text x="1470" y="882" text-anchor="middle" fill="#d8cdfd" font-size="15">X_agent(t)</text>
  </g>

  <g fill="none" stroke="#9fb2ce" stroke-width="4" marker-end="url(#arrow)">
    <path d="M315 228H370Q400 228 430 275"/><path d="M315 322H400"/><path d="M315 418H370Q400 418 430 375"/>
    <path d="M700 322H1170Q1210 322 1210 335"/><path d="M1080 265H1210"/>
    <path d="M315 588H390"/><path d="M315 683H390"/><path d="M600 638H675"/><path d="M945 638H1020"/>
    <path d="M315 418H970Q1020 418 1060 570"/><path d="M1350 638H1390Q1430 638 1430 440"/>
    <path d="M1365 440V760Q1365 800 1005 840"/><path d="M1005 862H1080"/><path d="M1325 862H1390"/>
    <path d="M1470 925V950H45V683H70"/>
  </g>
  <text x="800" y="958" text-anchor="middle" fill="#9fb2ce" font-family="Arial" font-size="16">X_agent(t) сохраняется только как точка отсчёта следующего шага; current_state(t) повторно не пересчитывается</text>
</svg>
