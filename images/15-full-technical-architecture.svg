<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="t d"><title id="t">Полная инженерная архитектура</title><desc id="d">Текстовый слой, акустические прото-эмоции, контекстное умножение, характер и память формируют состояние через два слоя.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#9fb2ce"/></marker></defs><rect width="1600" height="940" rx="28" fill="#081426"/><text x="70" y="70" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">Полный конвейер формирования состояния</text><text x="70" y="105" fill="#9fb2ce" font-family="Arial" font-size="18">Аудио проходит через previous_state и не создаёт эмоцию самостоятельно</text><g font-family="Arial">
<rect x="70" y="160" width="270" height="90" rx="16" fill="#142a47" stroke="#62a8ff" stroke-width="2"/><text x="105" y="214" fill="#f4f7fb" font-size="22">text_emotions</text>
<rect x="70" y="285" width="270" height="90" rx="16" fill="#142a47" stroke="#62a8ff" stroke-width="2"/><text x="105" y="339" fill="#f4f7fb" font-size="21">response_emotions</text>
<rect x="70" y="410" width="270" height="90" rx="16" fill="#211e42" stroke="#a78bfa" stroke-width="2"/><text x="105" y="464" fill="#f4f7fb" font-size="21">previous_state</text>
<rect x="430" y="250" width="320" height="150" rx="20" fill="#12334a" stroke="#57d3a0" stroke-width="3"/><text x="510" y="312" fill="#f4f7fb" font-size="24" font-weight="700">Первый слой</text><text x="500" y="355" fill="#bfead8" font-size="21">semantic_state</text>
<rect x="70" y="590" width="270" height="90" rx="16" fill="#2a2336" stroke="#f5b95f" stroke-width="2"/><text x="105" y="644" fill="#f4f7fb" font-size="21">proto_emotions</text>
<rect x="410" y="590" width="310" height="90" rx="16" fill="#2a2336" stroke="#f5b95f" stroke-width="2"/><text x="445" y="627" fill="#f4f7fb" font-size="18">proto_to_emotion_weights</text><text x="485" y="658" fill="#f5d9a7" font-size="17">→ audio_emotions</text>
<circle cx="850" cy="635" r="62" fill="#3b2b25" stroke="#f5b95f" stroke-width="3"/><text x="850" y="653" text-anchor="middle" fill="#f5b95f" font-size="43" font-weight="700">⊙</text><text x="850" y="720" text-anchor="middle" fill="#9fb2ce" font-size="16">previous_state</text>
<rect x="980" y="580" width="290" height="110" rx="18" fill="#143326" stroke="#57d3a0" stroke-width="3"/><text x="1020" y="626" fill="#f4f7fb" font-size="20" font-weight="700">Контекстный</text><text x="1020" y="656" fill="#f4f7fb" font-size="20" font-weight="700">аудиовклад</text>
<rect x="820" y="300" width="300" height="90" rx="16" fill="#142a47" stroke="#a78bfa" stroke-width="2"/><text x="855" y="354" fill="#f4f7fb" font-size="21">character_baseline</text>
<rect x="1230" y="340" width="290" height="180" rx="20" fill="#23304a" stroke="#a78bfa" stroke-width="3"/><text x="1300" y="402" fill="#f4f7fb" font-size="24" font-weight="700">Второй слой</text><text x="1295" y="450" fill="#d8cdfd" font-size="21">current_state</text><text x="1290" y="485" fill="#9fb2ce" font-size="16">после constrain</text>
<rect x="1060" y="805" width="460" height="80" rx="40" fill="#143326" stroke="#57d3a0" stroke-width="3"/><text x="1290" y="854" text-anchor="middle" fill="#f4f7fb" font-size="19">сохранить как previous_state следующего шага</text>
</g><g fill="none" stroke="#9fb2ce" stroke-width="4" marker-end="url(#a)"><path d="M340 205H400Q430 205 450 270"/><path d="M340 330H430"/><path d="M340 455H390Q420 455 450 390"/><path d="M750 325H1230"/><path d="M1120 345H1230"/><path d="M340 635H410"/><path d="M720 635H788"/><path d="M340 455H780V595"/><path d="M912 635H980"/><path d="M1270 635H1375V520"/><path d="M1375 520V805"/></g><rect x="80" y="810" width="790" height="70" rx="20" fill="#142a47" stroke="#f5b95f" stroke-width="2"/><text x="475" y="840" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="17">Инвариант: audio_emotions[i] × previous_state[i] = 0,</text><text x="475" y="866" text-anchor="middle" fill="#f5d9a7" font-family="Arial" font-size="17">если эмоциональная координата i не активна до события</text></svg>