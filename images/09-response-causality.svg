<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="700" y="50" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#172033">Причинность response_emotions</text><g font-family="Arial"><text x="70" y="115" font-size="20" font-weight="700" fill="#315e9d">Однопроходный режим</text><g fill="#fff" stroke="#315e9d" stroke-width="2"><rect x="70" y="140" width="230" height="85" rx="15"/><rect x="380" y="140" width="230" height="85" rx="15"/><rect x="690" y="140" width="250" height="85" rx="15"/><rect x="1020" y="140" width="300" height="85" rx="15"/></g><g text-anchor="middle" font-size="17"><text x="185" y="190">Входы шага t</text><text x="495" y="190">Ответ t</text><text x="815" y="190">response_emotions t</text><text x="1170" y="180">Новое состояние</text><text x="1170" y="204">влияет на шаг t+1</text></g><g stroke="#53647d" stroke-width="4"><path d="M300 183H380"/><path d="M610 183H690"/><path d="M940 183H1020"/></g><text x="70" y="320" font-size="20" font-weight="700" fill="#087b79">Двухпроходный режим — расширение</text><g fill="#fff" stroke="#087b79" stroke-width="2"><rect x="70" y="345" width="250" height="85" rx="15"/><rect x="400" y="345" width="250" height="85" rx="15"/><rect x="730" y="345" width="250" height="85" rx="15"/><rect x="1060" y="345" width="260" height="85" rx="15"/></g><g text-anchor="middle" font-size="17"><text x="195" y="395">Черновой ответ</text><text x="525" y="395">Обновление состояния</text><text x="855" y="395">Повторный контекст</text><text x="1190" y="395">Финальный ответ</text></g><g stroke="#53647d" stroke-width="4"><path d="M320 388H400"/><path d="M650 388H730"/><path d="M980 388H1060"/></g><rect x="210" y="490" width="980" height="42" rx="17" fill="#fff5ec"/><text x="700" y="517" text-anchor="middle" font-size="16" fill="#8a481d">Режим выбирается явно: скрытый цикл между ответом и состоянием недопустим.</text></g></svg>