<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
<title id="t">Вся модель эмоционального состояния агента</title><desc id="d">Текст формирует смысловые эмоции, аудио — прото-эмоции, предыдущее состояние задаёт контекст, а характер и память формируют новое состояние.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#65738b"/></marker></defs>
<rect width="1600" height="980" rx="30" fill="#f8f9fc"/>
<text x="800" y="62" text-anchor="middle" font-family="Segoe UI,Arial" font-size="34" font-weight="800" fill="#172033">Вся модель эмоционального состояния агента</text>
<text x="800" y="98" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#606b7c">Звук не выбирает эмоцию: он меняет только уже существующий эмоциональный контекст</text>
<g font-family="Segoe UI,Arial">
<rect x="70" y="175" width="330" height="150" rx="22" fill="#fff" stroke="#7357c8" stroke-width="4"/><text x="235" y="220" text-anchor="middle" font-size="23" font-weight="800" fill="#513b9a">ТЕКСТ</text><text x="235" y="260" text-anchor="middle" font-size="18" fill="#172033">смысл слов</text><text x="235" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#513b9a">text_emotions</text>
<rect x="70" y="425" width="330" height="180" rx="22" fill="#fff" stroke="#087b79" stroke-width="4"/><text x="235" y="470" text-anchor="middle" font-size="23" font-weight="800" fill="#075f5e">АУДИО</text><text x="235" y="507" text-anchor="middle" font-size="17" fill="#172033">интенсивность · скорость · тон</text><text x="235" y="540" text-anchor="middle" font-size="17" fill="#172033">колебания · наклон</text><text x="235" y="577" text-anchor="middle" font-size="20" font-weight="700" fill="#075f5e">прото-эмоции</text>
<rect x="520" y="175" width="390" height="150" rx="22" fill="#f3efff" stroke="#7357c8" stroke-width="4"/><text x="715" y="222" text-anchor="middle" font-size="23" font-weight="800" fill="#513b9a">ТЕКСТОВАЯ РЕАКЦИЯ</text><text x="715" y="262" text-anchor="middle" font-size="18" fill="#172033">смысл + ответ агента + память</text><text x="715" y="295" text-anchor="middle" font-size="20" font-weight="700" fill="#513b9a">semantic_state</text>
<rect x="520" y="425" width="390" height="180" rx="22" fill="#eaf8f6" stroke="#087b79" stroke-width="4"/><text x="715" y="468" text-anchor="middle" font-size="22" font-weight="800" fill="#075f5e">ПОТЕНЦИАЛЬНОЕ ВЛИЯНИЕ</text><text x="715" y="510" text-anchor="middle" font-size="18" fill="#172033">proto_emotions → audio_emotions</text><text x="715" y="550" text-anchor="middle" font-size="20" font-weight="800" fill="#075f5e">⊙ previous_state</text><text x="715" y="580" text-anchor="middle" font-size="16" fill="#606b7c">контекст до события</text>
<rect x="1030" y="270" width="470" height="260" rx="28" fill="#edf4ff" stroke="#315e9d" stroke-width="5"/><text x="1265" y="320" text-anchor="middle" font-size="24" font-weight="800" fill="#234c84">СОБСТВЕННАЯ РЕАКЦИЯ АГЕНТА</text><text x="1265" y="365" text-anchor="middle" font-size="18" fill="#172033">semantic_state</text><text x="1265" y="400" text-anchor="middle" font-size="18" fill="#172033">контекстное влияние аудио</text><text x="1265" y="435" text-anchor="middle" font-size="18" fill="#172033">характер персонажа</text><text x="1265" y="485" text-anchor="middle" font-size="23" font-weight="800" fill="#234c84">current_state</text>
<rect x="955" y="680" width="620" height="150" rx="70" fill="#7357c8"/><text x="1265" y="735" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">ЭМОЦИОНАЛЬНАЯ ПАМЯТЬ</text><text x="1265" y="775" text-anchor="middle" font-size="18" fill="#f0ebff">current_state сохраняется и становится</text><text x="1265" y="805" text-anchor="middle" font-size="18" fill="#f0ebff">контекстом следующего события</text>
<rect x="70" y="720" width="650" height="120" rx="20" fill="#fff5ec" stroke="#d97a3a" stroke-width="3"/><text x="395" y="767" text-anchor="middle" font-size="20" font-weight="800" fill="#9b511e">ОДИНАКОВОЕ АУДИО — РАЗНЫЙ РЕЗУЛЬТАТ</text><text x="395" y="807" text-anchor="middle" font-size="17" fill="#172033">эффект зависит от current_state, а не от «эмоции в звуке»</text>
</g>
<g fill="none" stroke="#65738b" stroke-width="5" marker-end="url(#a)"><path d="M400 250H520"/><path d="M400 515H520"/><path d="M910 250H1030"/><path d="M910 515H1030"/><path d="M1265 530V680"/><path d="M955 755H820Q780 755 780 630Q780 590 910 555"/></g>
</svg>