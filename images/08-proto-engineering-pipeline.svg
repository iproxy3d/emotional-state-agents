<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="t d"><title id="t">Контракт акустического канала</title><desc id="d">Акустические признаки формируют прото-эмоции и потенциальный audio_emotions, который умножается на предыдущее состояние.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#53647d"/></marker></defs><rect width="1500" height="720" fill="#f7f9fc"/><text x="750" y="58" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#172033">Контракт акустического канала</text><text x="750" y="91" text-anchor="middle" font-family="Arial" font-size="17" fill="#606b7c">Аудио не создаёт эмоцию — оно модифицирует состояние, уже существовавшее в момент сигнала</text><g font-family="Arial">
<rect x="55" y="155" width="250" height="130" rx="20" fill="#fff" stroke="#087b79" stroke-width="3"/><text x="180" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#075f5e">Акустические</text><text x="180" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#075f5e">измерения</text><text x="180" y="258" text-anchor="middle" font-size="15" fill="#606b7c">скорость · тон · интенсивность</text>
<rect x="360" y="155" width="260" height="130" rx="20" fill="#fff" stroke="#087b79" stroke-width="3"/><text x="490" y="208" text-anchor="middle" font-size="21" font-weight="700" fill="#075f5e">proto_emotions</text><text x="490" y="248" text-anchor="middle" font-size="15" fill="#606b7c">PROTO_EMOTION_SPACE</text>
<rect x="675" y="155" width="285" height="130" rx="20" fill="#edf4ff" stroke="#315e9d" stroke-width="3"/><text x="818" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#234c84">Проекция</text><text x="818" y="236" text-anchor="middle" font-size="16" fill="#172033">proto_to_emotion_weights</text><text x="818" y="263" text-anchor="middle" font-size="14" fill="#606b7c">многие ко многим</text>
<rect x="1015" y="155" width="280" height="130" rx="20" fill="#fff" stroke="#315e9d" stroke-width="3"/><text x="1155" y="208" text-anchor="middle" font-size="21" font-weight="700" fill="#234c84">audio_emotions</text><text x="1155" y="248" text-anchor="middle" font-size="15" fill="#606b7c">потенциальное влияние</text>
<circle cx="910" cy="475" r="64" fill="#fff5ec" stroke="#d97a3a" stroke-width="4"/><text x="910" y="491" text-anchor="middle" font-size="43" font-weight="700" fill="#9b511e">⊙</text>
<rect x="535" y="410" width="270" height="130" rx="20" fill="#fff" stroke="#7357c8" stroke-width="3"/><text x="670" y="458" text-anchor="middle" font-size="20" font-weight="700" fill="#513b9a">previous_state</text><text x="670" y="492" text-anchor="middle" font-size="15" fill="#606b7c">current_state до события</text><text x="670" y="518" text-anchor="middle" font-size="14" fill="#606b7c">эмоциональный контекст</text>
<rect x="1040" y="410" width="360" height="130" rx="20" fill="#eaf8f6" stroke="#087b79" stroke-width="4"/><text x="1220" y="458" text-anchor="middle" font-size="21" font-weight="700" fill="#075f5e">audio_contribution</text><text x="1220" y="494" text-anchor="middle" font-size="16" fill="#172033">фактическое влияние</text><text x="1220" y="520" text-anchor="middle" font-size="14" fill="#606b7c">только на активный контекст</text>
<rect x="150" y="615" width="1200" height="52" rx="18" fill="#edf4ff"/><text x="750" y="648" text-anchor="middle" font-size="17" fill="#294f83">Нулевая координата previous_state остаётся нулевой: аудио не порождает смысловую эмоцию самостоятельно.</text>
</g><g fill="none" stroke="#53647d" stroke-width="4" marker-end="url(#a)"><path d="M305 220H360"/><path d="M620 220H675"/><path d="M960 220H1015"/><path d="M1155 285V380Q1155 410 974 450"/><path d="M805 475H846"/><path d="M974 475H1040"/></g></svg>