<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">От двух аудиосигналов к прото-эмоциональной коррекции</title>
  <desc id="desc">Один экстрактор получает абсолютные признаки собеседника и агента, затем вычисляются относительные признаки, нормализация, влияние на эмоции и контекстная коррекция.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#53647d"/></marker></defs>
  <rect width="1600" height="820" rx="28" fill="#f7f9fc"/>
  <text x="800" y="58" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#172033">Акустические признаки и прото-эмоции</text>
  <text x="800" y="92" text-anchor="middle" font-family="Arial" font-size="18" fill="#606b7c">Сравниваются два голоса; готовая эмоция из аудио не распознаётся</text>
  <g font-family="Arial">
    <rect x="55" y="145" width="260" height="105" rx="18" fill="#fff" stroke="#087b79" stroke-width="3"/><text x="185" y="188" text-anchor="middle" font-size="21" font-weight="700" fill="#075f5e">A_other(t)</text><text x="185" y="219" text-anchor="middle" font-size="16" fill="#606b7c">аудио собеседника</text>
    <rect x="55" y="300" width="260" height="105" rx="18" fill="#fff" stroke="#7357c8" stroke-width="3"/><text x="185" y="343" text-anchor="middle" font-size="21" font-weight="700" fill="#513b9a">A_agent(t−1)</text><text x="185" y="374" text-anchor="middle" font-size="16" fill="#606b7c">предыдущий голос агента</text>
    <rect x="390" y="205" width="250" height="140" rx="22" fill="#eaf8f6" stroke="#087b79" stroke-width="4"/><text x="515" y="258" text-anchor="middle" font-size="25" font-weight="700" fill="#075f5e">Fθ</text><text x="515" y="291" text-anchor="middle" font-size="17" fill="#172033">один экстрактор</text><text x="515" y="318" text-anchor="middle" font-size="15" fill="#606b7c">абсолютные величины</text>
    <rect x="720" y="145" width="270" height="105" rx="18" fill="#fff" stroke="#315e9d" stroke-width="3"/><text x="855" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#234c84">X_other(t)</text><text x="855" y="219" text-anchor="middle" font-size="15" fill="#606b7c">абсолютные признаки</text>
    <rect x="720" y="300" width="270" height="105" rx="18" fill="#fff" stroke="#7357c8" stroke-width="3"/><text x="855" y="343" text-anchor="middle" font-size="20" font-weight="700" fill="#513b9a">X_agent(t−1)</text><text x="855" y="374" text-anchor="middle" font-size="15" fill="#606b7c">акустический bias</text>
    <rect x="1070" y="205" width="280" height="140" rx="22" fill="#edf4ff" stroke="#315e9d" stroke-width="4"/><text x="1210" y="255" text-anchor="middle" font-size="22" font-weight="700" fill="#234c84">ΔX = X_other − X_agent</text><text x="1210" y="291" text-anchor="middle" font-size="17" fill="#172033">normalize(min, max)</text><text x="1210" y="320" text-anchor="middle" font-size="15" fill="#606b7c">границы профиля фиксированы</text>
    <rect x="120" y="515" width="360" height="135" rx="22" fill="#fff" stroke="#087b79" stroke-width="3"/><text x="300" y="558" text-anchor="middle" font-size="21" font-weight="700" fill="#075f5e">s(t)</text><text x="300" y="592" text-anchor="middle" font-size="17" fill="#172033">activity · anxiety · tempo</text><text x="300" y="620" text-anchor="middle" font-size="15" fill="#606b7c">знак — направление, модуль — сила</text>
    <rect x="535" y="515" width="265" height="135" rx="22" fill="#fff5ec" stroke="#d97a3a" stroke-width="3"/><text x="668" y="560" text-anchor="middle" font-size="21" font-weight="700" fill="#9b511e">deviation(t)</text><text x="668" y="594" text-anchor="middle" font-size="16" fill="#172033">амплитуда / энергия</text><text x="668" y="622" text-anchor="middle" font-size="15" fill="#606b7c">масштаб воздействия</text>
    <rect x="855" y="515" width="280" height="135" rx="22" fill="#edf4ff" stroke="#315e9d" stroke-width="3"/><text x="995" y="559" text-anchor="middle" font-size="21" font-weight="700" fill="#234c84">p(t) = Mᵀs(t)</text><text x="995" y="593" text-anchor="middle" font-size="16" fill="#172033">сумма частичных влияний</text><text x="995" y="621" text-anchor="middle" font-size="15" fill="#606b7c">не диагноз эмоции</text>
    <rect x="1210" y="490" width="330" height="185" rx="24" fill="#eaf8f6" stroke="#087b79" stroke-width="4"/><text x="1375" y="536" text-anchor="middle" font-size="21" font-weight="700" fill="#075f5e">A_proto(t)</text><text x="1375" y="574" text-anchor="middle" font-size="16" fill="#172033">η × deviation ×</text><text x="1375" y="604" text-anchor="middle" font-size="16" fill="#172033">previous_state ⊙ p(t)</text><text x="1375" y="640" text-anchor="middle" font-size="15" fill="#606b7c">готовая коррекция второго слоя</text>
    <rect x="825" y="700" width="310" height="70" rx="18" fill="#f0ecff" stroke="#7357c8" stroke-width="3"/><text x="980" y="744" text-anchor="middle" font-size="18" font-weight="700" fill="#513b9a">previous_state(t−1)</text>
  </g>
  <g fill="none" stroke="#53647d" stroke-width="4" marker-end="url(#arrow)"><path d="M315 198H390"/><path d="M315 352H390"/><path d="M640 250H720"/><path d="M640 300H720"/><path d="M990 198H1030Q1070 198 1090 230"/><path d="M990 352H1030Q1070 352 1090 320"/><path d="M1210 345V445Q1210 480 455 535"/><path d="M1210 345V455Q1210 490 790 535"/><path d="M480 582H855"/><path d="M800 605H855"/><path d="M1135 582H1210"/><path d="M1135 735H1170Q1210 735 1245 660"/></g>
</svg>
