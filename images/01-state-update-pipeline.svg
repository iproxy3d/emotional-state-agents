<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Двухступенчатое обновление эмоционального состояния</title><desc id="d">Первый слой объединяет текст, ответ и память. Во втором аудиовлияние ограничивается предыдущим состоянием и объединяется с характером.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#52627a"/></marker></defs><rect width="1500" height="900" fill="#f7f9fc"/><text x="750" y="58" text-anchor="middle" font-family="Segoe UI,Arial" font-size="32" font-weight="800" fill="#172033">Один шаг обновления состояния</text><text x="750" y="94" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#606b7c">previous_state фиксируется до расчёта и одновременно служит памятью и контекстом аудио</text><g font-family="Segoe UI,Arial">
<rect x="50" y="150" width="270" height="100" rx="18" fill="#fff" stroke="#7357c8" stroke-width="3"/><text x="185" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#513b9a">text_emotions</text><text x="185" y="220" text-anchor="middle" font-size="14" fill="#606b7c">смысл текста</text>
<rect x="50" y="285" width="270" height="100" rx="18" fill="#fff" stroke="#7357c8" stroke-width="3"/><text x="185" y="325" text-anchor="middle" font-size="18" font-weight="700" fill="#513b9a">response_emotions</text><text x="185" y="355" text-anchor="middle" font-size="14" fill="#606b7c">смысл ответа</text>
<rect x="50" y="420" width="270" height="100" rx="18" fill="#fff" stroke="#d97a3a" stroke-width="3"/><text x="185" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#9b511e">previous_state</text><text x="185" y="490" text-anchor="middle" font-size="14" fill="#606b7c">состояние до события</text>
<rect x="420" y="220" width="350" height="220" rx="26" fill="#f3efff" stroke="#7357c8" stroke-width="4"/><text x="595" y="270" text-anchor="middle" font-size="23" font-weight="800" fill="#513b9a">ПЕРВЫЙ СЛОЙ</text><text x="595" y="310" text-anchor="middle" font-size="16" fill="#172033">текст + ответ + память</text><text x="595" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#513b9a">semantic_state</text>
<rect x="50" y="610" width="270" height="100" rx="18" fill="#fff" stroke="#087b79" stroke-width="3"/><text x="185" y="650" text-anchor="middle" font-size="18" font-weight="700" fill="#075f5e">audio_emotions</text><text x="185" y="680" text-anchor="middle" font-size="14" fill="#606b7c">потенциальное влияние</text>
<circle cx="485" cy="650" r="64" fill="#fff5ec" stroke="#d97a3a" stroke-width="4"/><text x="485" y="666" text-anchor="middle" font-size="42" font-weight="800" fill="#9b511e">⊙</text><text x="485" y="744" text-anchor="middle" font-size="15" fill="#606b7c">previous_state</text>
<rect x="610" y="590" width="300" height="120" rx="20" fill="#eaf8f6" stroke="#087b79" stroke-width="3"/><text x="760" y="638" text-anchor="middle" font-size="19" font-weight="700" fill="#075f5e">Контекстный</text><text x="760" y="667" text-anchor="middle" font-size="19" font-weight="700" fill="#075f5e">аудиовклад</text><text x="760" y="694" text-anchor="middle" font-size="14" fill="#606b7c">не создаёт новые эмоции</text>
<rect x="850" y="310" width="270" height="100" rx="18" fill="#fff" stroke="#39a19d" stroke-width="3"/><text x="985" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#075f5e">character_baseline</text><text x="985" y="380" text-anchor="middle" font-size="14" fill="#606b7c">характер</text>
<rect x="1030" y="520" width="360" height="210" rx="26" fill="#edf4ff" stroke="#315e9d" stroke-width="4"/><text x="1210" y="570" text-anchor="middle" font-size="23" font-weight="800" fill="#234c84">ВТОРОЙ СЛОЙ</text><text x="1210" y="610" text-anchor="middle" font-size="16" fill="#172033">semantic_state + характер</text><text x="1210" y="640" text-anchor="middle" font-size="16" fill="#172033">+ контекстный аудиовклад</text><text x="1210" y="690" text-anchor="middle" font-size="22" font-weight="700" fill="#234c84">current_state</text>
<rect x="1030" y="790" width="360" height="70" rx="35" fill="#7357c8"/><text x="1210" y="833" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">сохранить для следующего шага</text>
</g><g fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#a)"><path d="M320 200H420"/><path d="M320 335H420"/><path d="M320 470H370Q400 470 420 405"/><path d="M770 330H900Q950 330 1030 565"/><path d="M1120 360H1420V600H1390"/><path d="M320 660H421"/><path d="M320 470H360V610Q360 650 421 650"/><path d="M549 650H610"/><path d="M910 650H1030"/><path d="M1210 730V790"/></g></svg>