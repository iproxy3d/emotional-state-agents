<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Два уровня формирования эмоционального состояния</title><desc id="desc">Смысл слов, смысл ответа и память формируют семантическое состояние; звучание и характер преобразуют его в итоговое состояние.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#53647d"/></marker></defs>
<rect width="1400" height="760" fill="#f7f9fc"/>
<text x="700" y="55" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#172033">Два последовательных уровня восприятия</text>
<text x="700" y="91" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#606b7c">Сначала — эмоциональный смысл ситуации, затем — коррекция звучанием и характером</text>
<g font-family="Segoe UI,Arial">
 <rect x="55" y="145" width="290" height="105" rx="18" fill="#fff" stroke="#947ee0" stroke-width="3"/><text x="200" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#513b9a">Слова собеседника</text><text x="200" y="218" text-anchor="middle" font-size="15" fill="#606b7c">что эмоционально означает реплика</text>
 <rect x="55" y="300" width="290" height="105" rx="18" fill="#fff" stroke="#947ee0" stroke-width="3"/><text x="200" y="340" text-anchor="middle" font-size="19" font-weight="700" fill="#513b9a">Ответ агента</text><text x="200" y="373" text-anchor="middle" font-size="15" fill="#606b7c">какую позицию он занял</text>
 <rect x="55" y="455" width="290" height="105" rx="18" fill="#fff" stroke="#947ee0" stroke-width="3"/><text x="200" y="495" text-anchor="middle" font-size="19" font-weight="700" fill="#513b9a">Эмоциональная память</text><text x="200" y="528" text-anchor="middle" font-size="15" fill="#606b7c">что сохранилось с прошлого шага</text>
 <rect x="445" y="250" width="330" height="220" rx="25" fill="#edf4ff" stroke="#315e9d" stroke-width="4"/><text x="610" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#234c84">Семантическое состояние</text><text x="610" y="350" text-anchor="middle" font-size="17" fill="#172033">Что эмоционально происходит</text><text x="610" y="380" text-anchor="middle" font-size="17" fill="#172033">в этом взаимодействии?</text><text x="610" y="430" text-anchor="middle" font-size="15" fill="#606b7c">первый уровень</text>
 <rect x="870" y="155" width="300" height="105" rx="18" fill="#fff" stroke="#2ca39f" stroke-width="3"/><text x="1020" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#087b79">Звучание речи</text><text x="1020" y="228" text-anchor="middle" font-size="15" fill="#606b7c">как была произнесена реплика</text>
 <rect x="870" y="305" width="300" height="105" rx="18" fill="#fff" stroke="#2ca39f" stroke-width="3"/><text x="1020" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#087b79">Характер</text><text x="1020" y="378" text-anchor="middle" font-size="15" fill="#606b7c">как этот персонаж воспринимает события</text>
 <rect x="850" y="505" width="380" height="150" rx="28" fill="#7357c8"/><text x="1040" y="560" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Итоговое состояние</text><text x="1040" y="600" text-anchor="middle" font-size="17" fill="#eeeaff">полный эмоциональный профиль</text><text x="1040" y="629" text-anchor="middle" font-size="15" fill="#ded5fb">сохраняется для следующего шага</text>
</g>
<g fill="none" stroke="#53647d" stroke-width="4" marker-end="url(#arrow)"><path d="M345 198H395Q420 198 445 290"/><path d="M345 353H445"/><path d="M345 508H395Q420 508 445 430"/><path d="M775 360H810Q835 360 865 505"/><path d="M1170 208H1270Q1305 208 1305 455Q1305 505 1230 548"/><path d="M1170 358H1260Q1280 358 1230 585"/></g>
<rect x="55" y="690" width="1175" height="42" rx="18" fill="#fff5ec" stroke="#e4a170"/><text x="642" y="717" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#7b431e">Результат — не копия эмоции собеседника, а состояние конкретного персонажа после двух уровней преобразования.</text>
</svg>
