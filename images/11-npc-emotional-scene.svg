<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="700" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#172033">Эмоциональная история NPC внутри сцены</text><g font-family="Arial"><g fill="#fff" stroke="#7357c8" stroke-width="3"><rect x="65" y="145" width="260" height="125" rx="20"/><rect x="385" y="145" width="260" height="125" rx="20"/><rect x="705" y="145" width="260" height="125" rx="20"/><rect x="1025" y="145" width="310" height="125" rx="20"/></g><g text-anchor="middle" font-size="20" font-weight="700" fill="#513b9a"><text x="195" y="190">Угроза</text><text x="515" y="190">Помощь</text><text x="835" y="190">Повторная угроза</text><text x="1180" y="190">Примирение</text></g><g text-anchor="middle" font-size="15" fill="#606b7c"><text x="195" y="228">страх и недоверие ↑</text><text x="515" y="228">след снижается частично</text><text x="835" y="228">реакция усиливается</text><text x="1180" y="228">возврат постепенный</text></g><g stroke="#53647d" stroke-width="4"><path d="M325 208H385"/><path d="M645 208H705"/><path d="M965 208H1025"/></g><rect x="205" y="365" width="990" height="105" rx="22" fill="#eaf8f6"/><text x="700" y="407" text-anchor="middle" font-size="21" font-weight="700" fill="#075f5e">Каждое событие действует на результат предыдущего</text><text x="700" y="442" text-anchor="middle" font-size="16" fill="#606b7c">История сцены возникает из динамики, а не из мгновенных переключателей.</text></g></svg>