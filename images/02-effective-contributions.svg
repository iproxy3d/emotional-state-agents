<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">Эффективный вклад компонентов в итоговое состояние</title><desc id="desc">Развёрнутая формула показывает, через какие коэффициенты каждый вход достигает итогового состояния.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#52627a"/></marker></defs><rect width="1400" height="780" fill="#f7f9fc"/>
<text x="700" y="55" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#172033">Что именно формирует Eₜ</text>
<text x="700" y="91" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#606b7c">Раскрытие двух последовательных слоёв в пять независимых вкладов</text>
<g font-family="Segoe UI,Arial">
 <rect x="55" y="140" width="340" height="88" rx="16" fill="#fff" stroke="#9d8add" stroke-width="3"/><text x="78" y="176" font-size="18" font-weight="700" fill="#513b9a">Акустика собеседника</text><text x="78" y="207" font-family="Cambria Math,serif" font-size="21">dₛaₛ Oᵃᵘᵈⁱᵒₜ</text>
 <rect x="55" y="250" width="340" height="88" rx="16" fill="#fff" stroke="#39a19d" stroke-width="3"/><text x="78" y="286" font-size="18" font-weight="700" fill="#087b79">Характер персонажа</text><text x="78" y="317" font-family="Cambria Math,serif" font-size="21">dₛ Ξˢₜ ⊙ P</text>
 <rect x="55" y="360" width="340" height="88" rx="16" fill="#fff" stroke="#5f86bd" stroke-width="3"/><text x="78" y="396" font-size="18" font-weight="700" fill="#315e9d">Семантика собеседника</text><text x="78" y="427" font-family="Cambria Math,serif" font-size="21">dₛcₛdₜaₜ Oᵗᵉˣᵗₜ</text>
 <rect x="55" y="470" width="340" height="88" rx="16" fill="#fff" stroke="#5f86bd" stroke-width="3"/><text x="78" y="506" font-size="18" font-weight="700" fill="#315e9d">Смысл ответа агента</text><text x="78" y="537" font-family="Cambria Math,serif" font-size="21">dₛcₛdₜ Ξᵀₜ ⊙ Rₜ</text>
 <rect x="55" y="580" width="340" height="88" rx="16" fill="#fff" stroke="#d97a3a" stroke-width="3"/><text x="78" y="616" font-size="18" font-weight="700" fill="#9b511e">Эмоциональная память</text><text x="78" y="647" font-family="Cambria Math,serif" font-size="21">dₛcₛdₜcₜ Eₜ₋₁</text>
 <circle cx="760" cy="405" r="118" fill="#edf4ff" stroke="#315e9d" stroke-width="4"/><text x="760" y="390" text-anchor="middle" font-family="Cambria Math,serif" font-size="45" font-weight="700" fill="#234c84">Σ</text><text x="760" y="428" text-anchor="middle" font-size="17" fill="#52627a">покоординатная</text><text x="760" y="452" text-anchor="middle" font-size="17" fill="#52627a">сумма вкладов</text>
 <rect x="1050" y="310" width="285" height="190" rx="28" fill="#7357c8"/><text x="1192" y="380" text-anchor="middle" font-family="Cambria Math,serif" font-size="44" font-weight="700" fill="#fff">Eₜ</text><text x="1192" y="419" text-anchor="middle" font-size="18" fill="#f1edff">полный вектор</text><text x="1192" y="450" text-anchor="middle" font-size="15" fill="#e5defd">не одна метка</text>
</g>
<g fill="none" stroke="#52627a" stroke-width="3.5" marker-end="url(#a)"><path d="M395 184C540 184 560 318 650 350"/><path d="M395 294C530 294 570 355 640 380"/><path d="M395 404H630"/><path d="M395 514C530 514 570 455 640 430"/><path d="M395 624C540 624 560 490 650 458"/><path d="M878 405H1050"/></g>
<rect x="460" y="690" width="815" height="50" rx="15" fill="#fff5ec" stroke="#e4a170"/><text x="868" y="721" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#7b431e">Эффективный коэффициент памяти: λₑff = dₛcₛdₜcₜ</text>
</svg>
