<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="t d"><title id="t">Вклады в текущее состояние</title><desc id="d">Аудиовклад зависит от предыдущего состояния, остальные компоненты проходят по своим путям.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#52627a"/></marker></defs><rect width="1500" height="840" fill="#f7f9fc"/><text x="750" y="55" text-anchor="middle" font-family="Segoe UI,Arial" font-size="31" font-weight="800" fill="#172033">Что формирует current_state</text><text x="750" y="90" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#606b7c">Пять вкладов, но только аудио обязательно зависит от контекста до события</text><g font-family="Segoe UI,Arial">
<rect x="55" y="130" width="430" height="120" rx="18" fill="#fff5ec" stroke="#d97a3a" stroke-width="4"/><text x="82" y="168" font-size="19" font-weight="800" fill="#9b511e">Контекстный аудиовклад</text><text x="82" y="202" font-size="15" fill="#172033">audio_emotions ⊙ previous_state</text><text x="82" y="229" font-size="14" fill="#606b7c">аудио не создаёт нулевую координату</text>
<rect x="55" y="275" width="430" height="90" rx="16" fill="#fff" stroke="#39a19d" stroke-width="3"/><text x="82" y="312" font-size="18" font-weight="700" fill="#075f5e">Характер персонажа</text><text x="82" y="342" font-size="15">character_contribution</text>
<rect x="55" y="390" width="430" height="90" rx="16" fill="#fff" stroke="#315e9d" stroke-width="3"/><text x="82" y="427" font-size="18" font-weight="700" fill="#234c84">Смысл текста</text><text x="82" y="457" font-size="15">text_contribution</text>
<rect x="55" y="505" width="430" height="90" rx="16" fill="#fff" stroke="#315e9d" stroke-width="3"/><text x="82" y="542" font-size="18" font-weight="700" fill="#234c84">Смысл ответа агента</text><text x="82" y="572" font-size="15">response_contribution</text>
<rect x="55" y="620" width="430" height="90" rx="16" fill="#fff" stroke="#7357c8" stroke-width="3"/><text x="82" y="657" font-size="18" font-weight="700" fill="#513b9a">Эмоциональная память</text><text x="82" y="687" font-size="15">memory_contribution</text>
<circle cx="830" cy="425" r="128" fill="#edf4ff" stroke="#315e9d" stroke-width="4"/><text x="830" y="412" text-anchor="middle" font-family="Cambria Math,serif" font-size="47" font-weight="700" fill="#234c84">Σ</text><text x="830" y="452" text-anchor="middle" font-size="17" fill="#52627a">покоординатная</text><text x="830" y="478" text-anchor="middle" font-size="17" fill="#52627a">сумма вкладов</text>
<rect x="1140" y="325" width="300" height="200" rx="28" fill="#7357c8"/><text x="1290" y="402" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">current_state</text><text x="1290" y="442" text-anchor="middle" font-size="18" fill="#f1edff">полный вектор</text><text x="1290" y="474" text-anchor="middle" font-size="15" fill="#e5defd">контекст следующего шага</text>
<rect x="360" y="760" width="1020" height="50" rx="16" fill="#fff5ec" stroke="#e4a170"/><text x="870" y="792" text-anchor="middle" font-size="15" fill="#7b431e">previous_state имеет две роли: память и контекст для audio_contribution</text>
</g><g fill="none" stroke="#52627a" stroke-width="3.5" marker-end="url(#a)"><path d="M485 190C620 190 650 330 710 365"/><path d="M485 320C620 320 650 365 700 390"/><path d="M485 435H695"/><path d="M485 550C620 550 650 495 700 465"/><path d="M485 665C620 665 650 530 710 490"/><path d="M958 425H1140"/></g></svg>